[project]
name = "harnesslab"
version = "0.1.0"
description = "Educational, readable reference implementation of a coding-agent harness (clean-room, spec-driven)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # core is standard-library only

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
harnesslab = "harnesslab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnesslab"]

[tool.uv]
# Run straight from the source tree (no build step): keeps `uv run` fully offline.
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
